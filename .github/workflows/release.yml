name: Release

# Versioning follows Folio: version = git commit count on main,
#   tag vX.Y.Z with X.Y.Z = (count/100).(count/10 % 10).(count % 10),
# which is exactly what app/build.gradle.kts derives for the Android APK.
# The macOS app uses the same X.Y.Z as MARKETING_VERSION and the commit count
# as its build number. Each push to main publishes one GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.v.outputs.count }}
      name: ${{ steps.v.outputs.name }}
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(git rev-list --count HEAD)
          name="$((count / 100)).$(((count / 10) % 10)).$((count % 10))"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          # A release is complete once it has the APK, the DMG and the appcast; a partial
          # one (e.g. a failed Android build) is resumed and its assets are replaced.
          assets=$(gh release view "v$name" --json assets -q '.assets[].name' 2>/dev/null || true)
          if grep -q '\.apk$' <<<"$assets" && grep -q '\.dmg$' <<<"$assets" && grep -qx 'appcast.xml' <<<"$assets"; then
            echo "Release v$name is already complete"
            echo skip=true >> "$GITHUB_OUTPUT"
          else
            echo skip=false >> "$GITHUB_OUTPUT"
          fi

  # Created first so the faster macOS build can attach its assets as soon as it finishes.
  release:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists; resuming"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "OpenDisplay $NAME" --generate-notes
          fi

  android:
    needs: [version, release]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          # Override the default list, which includes the unavailable legacy 'tools' package.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/opendisplay-release.p12
          VERSION_NAME: ${{ needs.version.outputs.name }}
          VERSION_CODE_BASE: ${{ needs.version.outputs.count }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease -PopendisplayMinify=true --stacktrace
          apk="app/build/outputs/apk/release/OpenDisplay-$VERSION_NAME.apk"
          test -f "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/OpenDisplay-$VERSION_NAME.apk"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # The in-app updater reads SHA256SUMS; macOS publishes its own checksum file.
          (cd dist && sha256sum *.apk > SHA256SUMS)
          gh release upload "$TAG" dist/* --clobber

  macos:
    needs: [version, release]
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-26
    permissions:
      contents: write
    defaults:
      run:
        working-directory: opendisplay
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # No Apple Developer account: the apps are ad-hoc signed, not notarized.
      # Users open them via right-click > Open (or `xattr -cr OpenDisplay.app`).
      # Hardened runtime is off because library validation rejects the ad-hoc
      # signed Sparkle.framework. Updates are authenticated by Sparkle's EdDSA
      # signature instead (SPARKLE_PRIVATE_KEY <-> SUPublicEDKey in project.yml).
      - name: Build ad-hoc signed apps and Sparkle appcasts
        env:
          APP_MARKETING_VERSION: ${{ needs.version.outputs.name }}
          APP_BUILD_NUMBER: ${{ needs.version.outputs.count }}
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?Missing SPARKLE_PRIVATE_KEY secret}"
          sparkle=$(gh release view -R sparkle-project/Sparkle --json tagName -q .tagName)
          curl -fsSL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle/Sparkle-$sparkle.tar.xz"
          mkdir -p /tmp/sparkle && tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          sign_update=$(find /tmp/sparkle -name sign_update -type f | head -1)
          mkdir -p ../dist

          build() { # build <scheme> <app name> <dmg prefix> <appcast file> <feed title> <min macOS>
            scheme=$1 app_name=$2 prefix=$3 appcast=$4 title=$5
            export MIN_MACOS=$6
            xcodebuild -project OpenSidecar.xcodeproj -scheme "$scheme" \
              -configuration Release -derivedDataPath "build/$scheme" \
              CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_HARDENED_RUNTIME=NO \
              MARKETING_VERSION="$APP_MARKETING_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER" \
              build
            app="build/$scheme/Build/Products/Release/$app_name.app"
            # Xcode leaves Sparkle.framework signed by Sparkle's own Team ID, which dyld
            # rejects in an app without one. Re-sign the whole bundle ad-hoc, inside out.
            codesign --force --deep --sign - --preserve-metadata=entitlements "$app"
            # An ad-hoc signature's designated requirement is the binary's own hash, so every
            # build looks like a different app to macOS and Screen Recording / Accessibility
            # grants are dropped on each update. Re-sign just the outer bundle (nested code
            # keeps its signature) with a requirement pinned to the bundle identifier, which
            # stays the same across builds, so the existing grants keep matching.
            bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
            codesign --force --sign - --preserve-metadata=entitlements \
              -r="designated => identifier \"$bundle_id\"" "$app"
            codesign --verify --deep --strict "$app"
            codesign -d -r- "$app" 2>&1 | grep -F "identifier \"$bundle_id\"" \
              || { echo "::error::designated requirement not pinned to $bundle_id"; exit 1; }
            if codesign -dvv "$app" 2>&1 | grep -E 'flags=.*runtime|TeamIdentifier=[A-Z0-9]{10}'; then
              echo "::error::$app must not be hardened-runtime or carry a Team ID"; exit 1
            fi
            if codesign -dvv "$app/Contents/Frameworks/Sparkle.framework" 2>&1 | grep -E 'TeamIdentifier=[A-Z0-9]{10}'; then
              echo "::error::Sparkle.framework still carries a Team ID"; exit 1
            fi
            rm -rf "build/dmg-$scheme" && mkdir -p "build/dmg-$scheme"
            cp -R "$app" "build/dmg-$scheme/"
            ln -s /Applications "build/dmg-$scheme/Applications"
            dmg="../dist/$prefix-$APP_MARKETING_VERSION.dmg"
            hdiutil create -volname "$app_name" -srcfolder "build/dmg-$scheme" -ov -format UDZO "$dmg"
            signature=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sign_update" --ed-key-file - "$dmg")
            python3 - "$dmg" "$appcast" "$title" "$signature" <<'PY'
          import os, sys, email.utils
          dmg, appcast, title, signature = sys.argv[1:]
          env = os.environ
          url = f"https://github.com/{env['GITHUB_REPOSITORY']}/releases/download/{env['TAG']}/{os.path.basename(dmg)}"
          open(f"../dist/{appcast}", "w").write(f"""<?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>{title}</title>
                  <item>
                      <title>{env['APP_MARKETING_VERSION']}</title>
                      <pubDate>{email.utils.formatdate(usegmt=True)}</pubDate>
                      <sparkle:version>{env['APP_BUILD_NUMBER']}</sparkle:version>
                      <sparkle:shortVersionString>{env['APP_MARKETING_VERSION']}</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>{env['MIN_MACOS']}</sparkle:minimumSystemVersion>
                      <enclosure url="{url}" {signature} type="application/octet-stream"/>
                  </item>
              </channel>
          </rss>
          """)
          PY
          }

          build OpenSidecarMac "OpenDisplay" OpenDisplay appcast.xml OpenDisplay 14.0
          build OpenSidecarMacReceiver "OpenDisplay Receiver" OpenDisplayReceiver appcast-receiver.xml "OpenDisplay Receiver" 12.0
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          (cd ../dist && sha256sum *.dmg > SHA256SUMS-macos)
          gh release upload "$TAG" ../dist/* --clobber

name: Release

# Versioning follows Folio: version = git commit count on main,
#   tag vX.Y.Z with X.Y.Z = (count/100).(count/10 % 10).(count % 10),
# which is exactly what app/build.gradle.kts derives for the Android APK.
# The macOS app uses the same X.Y.Z as MARKETING_VERSION and the commit count
# as its build number. Each push to main publishes one GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.v.outputs.count }}
      name: ${{ steps.v.outputs.name }}
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(git rev-list --count HEAD)
          name="$((count / 100)).$(((count / 10) % 10)).$((count % 10))"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          if gh release view "v$name" >/dev/null 2>&1; then
            echo "Release v$name already exists"
            echo skip=true >> "$GITHUB_OUTPUT"
          else
            echo skip=false >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/opendisplay-release.p12
          VERSION_NAME: ${{ needs.version.outputs.name }}
          VERSION_CODE_BASE: ${{ needs.version.outputs.count }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease -PopendisplayMinify=true --stacktrace
          apk="app/build/outputs/apk/release/OpenDisplay-$VERSION_NAME.apk"
          test -f "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/OpenDisplay-$VERSION_NAME.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  macos:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-26
    defaults:
      run:
        working-directory: opendisplay
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: opendisplay
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: xcodegen generate
      - name: Set up SSH for match certs repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}
      - name: Build notarized macOS app
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APP_MARKETING_VERSION: ${{ needs.version.outputs.name }}
          APP_BUILD_NUMBER: ${{ needs.version.outputs.count }}
        run: |
          bundle exec fastlane mac build_release
          mkdir -p ../dist
          cp build/export/OpenDisplay.dmg "../dist/OpenDisplay-${APP_MARKETING_VERSION}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    needs: [version, android, macos]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "OpenDisplay $NAME" --generate-notes
